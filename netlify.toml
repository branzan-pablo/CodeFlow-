[build]
  command = "npm run build"
  publish = "dist/blog/browser"

# Configuração de ambiente
[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  # IMPORTANTE: Deixe o Angular runtime habilitado para SSR automático com Edge Functions
  # NETLIFY_USE_ANGULAR_RUNTIME = "true" é o padrão, não precisa declarar

# Regras de redirect para Decap CMS
# O admin deve servir arquivos estáticos, não passar pelo Angular
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# NOTA: Para SSR Angular, o Netlify usa Edge Functions automaticamente
# Não é necessário adicionar redirect /* → /index.html
# Isso é tratado pelo Angular runtime do Netlify

# Configuração de Image CDN (opcional)
# Descomente e configure se usar NgOptimizedImage com imagens de outros domínios
# [images]
#   remote_images = [
#     "https://exemplo.com/.*",
#     "https://cdn.exemplo.com/.*"
#   ]